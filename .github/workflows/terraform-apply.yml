name: Terraform apply

# Manually triggered only (workflow_dispatch) -- this provisions real
# infrastructure and incurs real AWS cost, so it should always be a
# deliberate action, never automatic. Review the Terraform plan PR
# check's output before running this, since that is the de facto
# review step: there is no interactive approval prompt here (-auto-
# approve is required since nothing is sitting at a terminal to type
# "yes" in CI).

on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Init
        run: terraform init

      - name: Apply
        run: terraform apply -auto-approve -no-color
