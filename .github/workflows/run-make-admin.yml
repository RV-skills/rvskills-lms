name: Grant Admin role to a user

# Manually triggered with the user's email. Runs make-admin.ts inside the running
# service-auth container through SSM Run Command (see .github/scripts/run-in-service-auth.sh),
# instead of starting a separate ECS task, which no longer works on the EC2 setup.

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email of the user to grant Admin to"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1

jobs:
  make-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Check the email
        env:
          TARGET_EMAIL: ${{ inputs.email }}
        run: |
          # The email ends up in a command on the server, so only plain addresses are allowed.
          if ! [[ "$TARGET_EMAIL" =~ ^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$ ]]; then
            echo "::error::That doesn't look like a plain email address"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Grant Admin inside the running service-auth container
        env:
          TARGET_EMAIL: ${{ inputs.email }}
        run: bash .github/scripts/run-in-service-auth.sh "apps/service-auth/node_modules/.bin/tsx apps/service-auth/prisma/make-admin.ts $TARGET_EMAIL"
