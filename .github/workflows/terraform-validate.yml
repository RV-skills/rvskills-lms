name: Terraform validate

# Checks the Terraform code is well-formed and internally consistent --
# no AWS credentials involved, no real resources touched. terraform init
# here uses local state, so this only ever validates syntax and
# structure, never reaches AWS. Once real credentials exist (a later
# step), a separate workflow will run terraform plan for real.

on:
  push:
    branches: [master]
    paths: ["terraform/**"]
  pull_request:
    branches: [master]
    paths: ["terraform/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Init (local backend only, no AWS calls)
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate
