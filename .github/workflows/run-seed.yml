name: Run service-auth seed

# Manually triggered. Runs seed.ts (roles and permissions) inside the running
# service-auth container through SSM Run Command, instead of a separate ECS task.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run the seed inside the running service-auth container
        run: bash .github/scripts/run-in-service-auth.sh "apps/service-auth/node_modules/.bin/tsx apps/service-auth/prisma/seed.ts"
