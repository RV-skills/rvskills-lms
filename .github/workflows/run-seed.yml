name: Run service-auth seed

# Manually triggered. Creates the default tenant, roles, and
# permissions that registration genuinely depends on (a fresh database
# has no Tenant row, and User creation has a foreign key constraint
# against it). Uses the same one-off-ECS-task pattern as
# run-migrations.yml, and the same real reason: RDS is not publicly
# reachable, so this can't run from a local machine or a plain
# internet-facing runner.

on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECS_CLUSTER: rvskills-cluster

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Read network config from Terraform state
        working-directory: terraform
        run: |
          terraform init
          SUBNETS=$(terraform output -json private_subnet_ids | jq -c .)
          SG=$(terraform output -raw app_security_group_id)
          echo "SUBNETS=$SUBNETS" >> "$GITHUB_ENV"
          echo "SG=$SG" >> "$GITHUB_ENV"

      - name: Run the seed script as a one-off ECS task
        run: |
          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "rvskills-service-auth" \
            --launch-type FARGATE \
            --network-configuration "{\"awsvpcConfiguration\":{\"subnets\":$SUBNETS,\"securityGroups\":[\"$SG\"],\"assignPublicIp\":\"DISABLED\"}}" \
            --overrides "{\"containerOverrides\":[{\"name\":\"service-auth\",\"command\":[\"apps/service-auth/node_modules/.bin/tsx\",\"apps/service-auth/prisma/seed.ts\"]}]}" \
            --query 'tasks[0].taskArn' --output text)

          echo "Started task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)

          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::Seed failed with exit code $EXIT_CODE"
            exit 1
          fi
          echo "Seed completed successfully"
